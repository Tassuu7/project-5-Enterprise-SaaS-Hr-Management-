<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise SSO & Login - WorkSphere HRMS</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header .brand-logo {
      margin: 0 auto 16px;
      width: 48px;
      height: 48px;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo">W</div>
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Enterprise Sign In</h2>
        <p style="color: var(--text-secondary); font-size: 13px;">Enter your enterprise corporate credentials</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Corporate Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@worksphere.corp" value="alexander.sterling@worksphere.corp" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" value="Admin@123456" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Sign In to WorkSphere</button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
        Demo Accounts: <code>alexander.sterling@worksphere.corp</code> (Super Admin) | Pass: <code>Admin@123456</code>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await app.request('/auth/login', {
          method: 'POST',
          body: { email, password }
        });
        app.setSession(res.data.token, res.data.user);
        app.showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/dashboard', 800);
      } catch (err) {
        // Error handled in app.js
      }
    });
  </script>
</body>
</html>
